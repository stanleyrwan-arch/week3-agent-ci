name: Agent-Optimized CI

on:
  push:
    branches:
      - main
      - "demo-*"
  pull_request:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  select-tests:
    runs-on: ubuntu-latest

    outputs:
      test_mode: ${{ steps.select.outputs.test_mode }}
      selected_tests: ${{ steps.select.outputs.selected_tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine changed-file range
        id: refs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"

            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              BEFORE="$(git rev-list --max-parents=0 "$HEAD")"
            fi

            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Select impacted tests
        id: select
        shell: bash
        run: |
          OUTPUT="$(python scripts/select_tests.py \
            --base '${{ steps.refs.outputs.base }}' \
            --head '${{ steps.refs.outputs.head }}')"

          echo "$OUTPUT"

          TEST_MODE="$(echo "$OUTPUT" |
            sed -n 's/^TEST_MODE=//p' |
            tail -1)"

          SELECTED_TESTS="$(echo "$OUTPUT" |
            sed -n 's/^SELECTED_TESTS=//p' |
            tail -1)"

          echo "test_mode=$TEST_MODE" >> "$GITHUB_OUTPUT"
          echo "selected_tests=$SELECTED_TESTS" >> "$GITHUB_OUTPUT"

  test:
    needs: select-tests
    runs-on: ubuntu-latest

    outputs:
      exit_code: ${{ steps.run_tests.outputs.exit_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure remediation demo dependency is absent
        run: |
          pip uninstall -y humanize || true

      - name: Skip irrelevant tests
        if: needs.select-tests.outputs.test_mode == 'skip'
        run: |
          echo "No application tests selected."
          echo "Only documentation or workflow files changed."

      - name: Run impacted tests
        id: run_tests
        if: needs.select-tests.outputs.test_mode != 'skip'
        shell: bash
        run: |
          set +e

          TEST_TARGETS="${{ needs.select-tests.outputs.selected_tests }}"

          if [[ -z "$TEST_TARGETS" ]]; then
            TEST_TARGETS="tests/"
          fi

          echo "Running test targets: $TEST_TARGETS"

          pytest $TEST_TARGETS -v --tb=short \
            > build_log.txt 2>&1

          RC=$?

          cat build_log.txt
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Upload build log
        if: always() && needs.select-tests.outputs.test_mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

  remediation:
    needs:
      - select-tests
      - test

    if: >
      needs.select-tests.outputs.test_mode != 'skip' &&
      needs.test.outputs.exit_code != '0'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install remediation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic PyGithub

      - name: Run scoped remediation agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: main
          MODEL: claude-haiku-4-5
        run: |
          python scripts/remediation_agent.py \
            --log build_log.txt \
            --open-pr

  human-approval:
    needs: remediation
    runs-on: ubuntu-latest
    environment: agent-proposed

    steps:
      - name: Confirm human review requirement
        run: |
          echo "The remediation PR was created."
          echo "A human reviewer must inspect and merge it manually."
